<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Хозы Гури · Маяк</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap">
<style>
/* Гури · Закупки хозов */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --fg:#17201d; --muted:#5d6b66; --line:#dbe2df;
  --accent:#0d6b5c; --accent-soft:#e1f0ec; --up:#b4361f; --up-soft:#fbe9e5; --down:#1f7a3d; --warn:#9a6a00; --warn-soft:#fbf1d8;
  --s-amega:#2f5fa8; --s-kost:#c98a12; --s-opt:#9c3d8f;
  --display:"Unbounded","Golos Text",system-ui,sans-serif; --body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1513; --surface:#17201d; --fg:#e6ece9; --muted:#97a6a0; --line:#2a3632;
  --accent:#4cc3a9; --accent-soft:#18302a; --up:#f08a72; --up-soft:#3a1f19; --down:#6fcf8d; --warn:#e6b84c; --warn-soft:#352b12;
  --s-amega:#6a93d6; --s-kost:#bb8a26; --s-opt:#bd72ba; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1513; --surface:#17201d; --fg:#e6ece9; --muted:#97a6a0; --line:#2a3632;
  --accent:#4cc3a9; --accent-soft:#18302a; --up:#f08a72; --up-soft:#3a1f19; --down:#6fcf8d; --warn:#e6b84c; --warn-soft:#352b12;
  --s-amega:#6a93d6; --s-kost:#bb8a26; --s-opt:#bd72ba; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:20px 60px}
header h1{font-family:var(--display);font-weight:700;font-size:26px;margin:0;letter-spacing:-.01em}
header .meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px;color:var(--muted)}
.chip b{color:var(--fg);font-weight:600}
.demo{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
nav.tabs{display:flex;gap:4px;margin:22px 0 16px;border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs button{font:inherit;font-weight:600;background:none;border:0;padding:10px 14px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--fg);border-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pts button,.cats button{font:inherit;font-size:14px;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.pts button[aria-pressed="true"],.cats button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.pts .n{font-size:12px;opacity:.75;margin-left:4px}
input[type=search]{font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);flex:1;min-width:0}
.btn{font:inherit;font-weight:600;font-size:14px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.btn.primary{background:var(--accent);color:var(--surface);border-color:var(--accent)}
.list{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.cathead{padding:10px 14px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--bg);border-top:1px solid var(--line)}
.cathead:first-child{border-top:0}
.item{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:9px 14px;border-top:1px solid var(--line)}
.item.on{background:var(--accent-soft)}
.item input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
.item .nm{min-width:0}
.item .nm small{display:block;color:var(--muted);font-size:12.5px}
.qty{display:flex;align-items:center;gap:4px}
.qty button{width:30px;height:30px;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;font-size:16px;cursor:pointer}
.qty input{width:48px;text-align:center;font:inherit;padding:4px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--fg)}
.flag{display:inline-block;font-size:11px;font-weight:600;color:var(--warn);background:var(--warn-soft);padding:1px 6px;border-radius:4px;margin-left:6px}
.sticky{position:sticky;bottom:0;margin-top:12px;background:var(--fg);color:var(--bg);border-radius:12px;padding:12px 16px;display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi .l{font-size:13px;color:var(--muted)}
.kpi .v{font-family:var(--display);font-weight:500;font-size:24px;margin-top:4px}
.kpi.good .v{color:var(--down)}
h2{font-family:var(--display);font-weight:500;font-size:18px;margin:28px 0 10px}

.sup{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-top:12px;overflow:hidden}
.sup>.h{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.sup>.h b{font-size:16px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:middle}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:7px 12px;border-top:1px solid var(--line);vertical-align:top}
th{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;border-top:0;background:var(--bg)}
td.r,th.r{text-align:right;white-space:nowrap}
.note{font-size:13px;padding:8px 16px;background:var(--warn-soft);color:var(--warn)}
.up{color:var(--up);font-weight:600}.dn{color:var(--down);font-weight:600}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line);min-width:120px}
.muted{color:var(--muted)}
pre.order{white-space:pre-wrap;font-family:var(--body);font-size:13.5px;margin:0;padding:12px 16px;background:var(--bg);max-height:260px;overflow:auto}
.lead{color:var(--muted);max-width:68ch;margin:0 0 12px}
.ptgrid td:first-child{font-weight:600}
@media (max-width:560px){header h1{font-size:21px}.item{grid-template-columns:24px 1fr}.item .qty{grid-column:2}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:var(--up);color:var(--surface);font-size:12px;line-height:20px;text-align:center}
.badge:empty{display:none}
.ncard{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
.ncard .top{display:grid;grid-template-columns:auto 1fr auto;gap:12px;padding:14px 16px;align-items:start}
.ncard .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-weight:700;font-size:15px}
.t-price .ic{background:var(--up-soft);color:var(--up)}
.t-recv .ic{background:var(--warn-soft);color:var(--warn)}
.t-info .ic{background:var(--accent-soft);color:var(--accent)}
.ncard h4{margin:0 0 3px;font-size:15.5px;text-wrap:balance}
.ncard .sub{color:var(--muted);font-size:13.5px}
.ncard .when{font-size:12px;color:var(--muted);white-space:nowrap}
.alts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.alt{font-size:13px;padding:3px 8px;border-radius:6px;background:var(--bg);border:1px solid var(--line)}
.alt.best{border-color:var(--down);color:var(--down);font-weight:600}
.acts{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 14px 62px}
.acts .btn{font-size:13.5px;padding:6px 11px}
.draft{border-top:1px solid var(--line);padding:12px 16px;background:var(--bg);display:grid;gap:8px}
.draft label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.draft textarea{font:inherit;font-size:14px;width:100%;min-height:110px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);resize:vertical}
.done{padding:10px 16px;border-top:1px solid var(--line);font-size:13.5px;color:var(--down);font-weight:600}
.ncard.resolved .top{opacity:.6}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px}
.rule{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px}
.rule b{display:block;margin-bottom:2px}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:12px;margin-top:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.card h3{font-size:14px;margin:0 0 10px;font-weight:600;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hb{display:grid;grid-template-columns:minmax(70px,auto) 1fr 64px;gap:8px;align-items:center;font-size:13.5px;padding:3px 0;position:relative}
.hb .tr{height:16px;position:relative}
.hb .fill{height:100%;border-radius:0 4px 4px 0;background:var(--accent)}
.hb .fill.over{background:var(--up)}
.hb .v{text-align:right}
.hb .norm{position:absolute;top:-3px;bottom:-3px;border-left:2px dashed var(--muted)}
.legend{font-size:12.5px;color:var(--muted);margin-top:8px;display:flex;gap:14px;flex-wrap:wrap}
.vb{display:flex;align-items:flex-end;gap:8px;height:170px;padding-top:18px;border-bottom:1px solid var(--line)}
.vb .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:12px}
.vb .bar{width:70%;max-width:42px;background:var(--accent);border-radius:4px 4px 0 0}
.vb .bar.over{background:var(--up)}
.vb .lb{display:flex;gap:8px;font-size:12px;color:var(--muted)}.vb+.lb span{flex:1;text-align:center}
[data-tip]{cursor:default}
.tip{position:fixed;pointer-events:none;background:var(--fg);color:var(--bg);font-size:12.5px;padding:6px 9px;border-radius:6px;z-index:10;max-width:260px}
.tg{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;max-width:560px;font-size:14px;white-space:pre-wrap}
.thread{border-top:1px solid var(--line);background:var(--bg);padding:12px 16px;display:grid;gap:8px}
.chan{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ch{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;padding:2px 7px;border-radius:5px;color:var(--surface)}
.ch.max{background:var(--s-amega)}.ch.mail{background:var(--s-opt)}
.msg{max-width:min(520px,88%);padding:9px 12px;border-radius:12px;font-size:14px;display:grid;gap:3px}
.msg.out{justify-self:end;background:var(--accent-soft);border-bottom-right-radius:4px}
.msg.in{justify-self:start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg .who{font-size:12px;font-weight:600;color:var(--muted)}
.msg .bt{white-space:pre-wrap}
.msg .meta{font-size:11.5px;color:var(--muted);text-align:right}
.msg .file{font-size:13px;padding:6px 8px;border-radius:6px;background:var(--bg);border:1px solid var(--line)}
.typing{font-size:13px;color:var(--muted)}
.typing span{animation:blink 1.2s infinite}.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,100%{opacity:.2}50%{opacity:1}}
.ai{font-size:13.5px;padding:9px 12px;border-radius:10px;border:1px dashed var(--accent);color:var(--fg);background:var(--surface)}
.ai b{color:var(--accent)}
.thread+.acts{padding:12px 16px 14px}
.roles{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;margin-top:14px;flex-wrap:wrap}
.roles button{font:inherit;font-weight:600;font-size:14px;border:0;background:none;color:var(--muted);padding:8px 14px;border-radius:7px;cursor:pointer}
.roles button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.who-line{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:16px 0 4px;font-size:14px;color:var(--muted)}
select{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg)}
.banner{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;padding:12px 16px;border-radius:12px;background:var(--surface);border:1px solid var(--line);margin:12px 0}
.banner.ok{background:var(--accent-soft);border-color:transparent}
.banner.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.item.ph{grid-template-columns:24px 52px 1fr auto}
.thumb{width:52px;height:52px;border-radius:8px;object-fit:cover;background:var(--bg);border:1px solid var(--line)}
.thumb.empty{display:grid;place-items:center;color:var(--muted);font-size:11px}
.hint{display:inline-block;font-size:12px;font-weight:600;color:var(--warn);background:var(--warn-soft);padding:2px 7px;border-radius:5px;margin-top:4px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font:inherit;font-size:13px;padding:6px 10px;border:0;background:var(--surface);color:var(--fg);cursor:pointer;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"].y{background:var(--accent);color:var(--surface)}
.seg button[aria-pressed="true"].l{background:var(--warn);color:var(--surface)}
.seg button[aria-pressed="true"].n{background:var(--up);color:var(--surface)}
.recv{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:10px 14px;border-top:1px solid var(--line);align-items:center}
.recv .ctl{grid-column:2;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:12px}
.panel h3{margin:0 0 8px;font-size:15px}
.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-top:8px;overflow-x:auto}
.subtabs button{font:inherit;font-weight:600;background:none;border:0;padding:9px 12px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.subtabs button[aria-pressed="true"]{color:var(--fg);border-color:var(--accent)}
.srow{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.srow:first-of-type{border-top:0}
.st{font-size:12.5px;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--bg);color:var(--muted);white-space:nowrap}
.st.ok{background:var(--accent-soft);color:var(--accent)}.st.warn{background:var(--warn-soft);color:var(--warn)}
.ch.wa{background:var(--down)}
.cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:820px){.cols{grid-template-columns:1fr}}
.chatbox{display:grid;gap:8px;max-height:420px;overflow:auto;padding:4px 2px}
.composer{display:flex;gap:6px;margin-top:8px}
.composer input{flex:1;min-width:0;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg)}
.qr{display:flex;flex-wrap:wrap;gap:6px}
.qr button{font:inherit;font-size:13px;padding:5px 10px;border-radius:999px;border:1px solid var(--accent);color:var(--accent);background:var(--surface);cursor:pointer}
.rule-row{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.rule-row:first-of-type{border-top:0}
.rule-row small{display:block;color:var(--muted);font-size:12.5px}
.rule-row.new{animation:flash 1.6s}
@keyframes flash{0%{background:var(--accent-soft)}100%{background:transparent}}
.log li{padding:6px 0;border-top:1px solid var(--line);font-size:14px;list-style:none}
.log{padding:0;margin:0}.log li:first-child{border-top:0}
.log time{color:var(--muted);font-size:12.5px;margin-right:8px}
.auto{font-size:13.5px;padding:10px 14px;border-radius:10px;background:var(--accent-soft);margin-bottom:8px}
.auto b{color:var(--accent)}
.btn:disabled{opacity:.55;cursor:not-allowed}
@media (max-width:560px){.item.ph{grid-template-columns:24px 44px 1fr}.item.ph .qty,.item.ph>b{grid-column:3}.thumb{width:44px;height:44px}.srow{grid-template-columns:1fr auto}.srow>.row{grid-column:1/-1}}
/* --- спокойная шапка и разрежённая вёрстка --- */
.wrap{max-width:980px}
.appbar{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:center;padding:18px 20px;border-radius:16px;background:var(--fg);color:var(--bg)}
.brand{display:flex;gap:12px;align-items:center}
.brand .mark{width:42px;height:42px;border-radius:11px;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:20px}
.brand b{display:block;font-family:var(--display);font-weight:500;font-size:18px;letter-spacing:-.01em}
.brand small{display:block;font-size:13px;opacity:.7;margin-top:2px}
.next{display:grid;gap:1px;text-align:right}
.next small{font-size:12px;opacity:.65;text-transform:uppercase;letter-spacing:.06em}
.next b{font-size:17px}
.next span{font-size:13px;opacity:.75}
@media (max-width:560px){.next{text-align:left}}
nav.roles{display:flex;margin:14px 0 0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
nav.roles button{flex:1;font:inherit;font-weight:600;font-size:14.5px;border:0;background:none;color:var(--muted);padding:10px 12px;border-radius:9px;cursor:pointer}
nav.roles button[aria-pressed="true"]{background:var(--accent);color:#fff}
.who-line{margin:18px 0 0;gap:8px}
.subtabs{margin-top:10px}
.screen-h{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:flex-start;margin:20px 0 6px}
.screen-h h2{margin:0;font-size:20px}
.screen-h p{margin:4px 0 0;font-size:14px}
.pill{font-size:13px;font-weight:600;padding:5px 12px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.pill.ok{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.block{margin-top:22px}
.bh{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;margin:0 2px 8px}
.bh h3{margin:0;font-size:15px}
.bh .muted{font-size:13px}
.block input[type=search]{width:100%}
.block .list{margin-top:0}
.foot{margin-top:40px;padding-top:14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.lead{font-size:14px}
[hidden]{display:none!important}
nav.roles{flex-wrap:nowrap}
@media (max-width:560px){nav.roles button{padding:9px 6px;font-size:13.5px}}
.inp{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg)}
.grp{margin:16px 2px 6px;font-size:14px;font-weight:600}
.chat{max-height:420px;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:6px 2px}.msg{max-width:82%;display:flex;flex-direction:column;gap:2px}.msg .b{padding:8px 12px;border-radius:12px;background:var(--bg);border:1px solid var(--line);white-space:pre-wrap;overflow-wrap:anywhere}.msg.buy{align-self:flex-end;align-items:flex-end}.msg.buy .b{background:var(--accent-soft);border-color:transparent}.msg.sys{align-self:center;max-width:100%}.msg.sys .b{background:none;border:none;color:var(--muted);font-size:13px;padding:2px}.msg small{color:var(--muted);font-size:12px}.okdot{color:var(--down);font-size:11px}.code{font-family:ui-monospace,monospace;background:var(--accent-soft);padding:1px 6px;border-radius:6px}

</head><body>
<div class="wrap">
<header class="appbar">
  <div class="brand"><span class="mark" aria-hidden="true">Г</span><div><b>Гури · Закупки хозов</b><small>Маяк · Приморская 2/4</small></div></div>
  <div class="next"><small>Ближайшая доставка</small><b id="nextDel">—</b><span id="nextCut"></span></div>

<div id="status" class="banner" hidden></div>
<div id="login" hidden></div>
<div id="app" hidden>
<div class="who-line" style="justify-content:space-between"><span>Вы: <b id="whoN"></b> <span id="busy" class="pill" hidden>сохраняю…</span></span><button class="btn" id="out">Выйти</button></div>

  <button data-role="dir" aria-pressed="false">Руководство</button>
</nav>
<section id="v-mgr">
  <div class="subtabs" role="group"><button data-mt="order" aria-pressed="true">Заявка</button><button data-mt="recv" aria-pressed="false">Приёмка</button></div>
  <div id="m-order"></div>
  <div id="m-recv" hidden></div>
</section>
<section id="v-buy" hidden>
  <div class="subtabs" role="group"><button data-bt="order" aria-pressed="true">Заказ поставщикам</button><button data-bt="feed" aria-pressed="false">Требует внимания <span class="badge" id="bb"></span></button><button data-bt="chat" aria-pressed="false">Поставщики</button><button data-bt="rules" aria-pressed="false">Договорённости</button></div>
  <div id="b-main"></div>
</section>
<section id="v-dir" hidden><div id="d-main"></div></section>
<footer class="foot">Данные хранятся в Google Таблице Гури. Фото накладных — в папке Google Диска. Пароль не передавайте посторонним.</footer>
</div>
</div>
<script>window.GURI_API='https://script.google.com/macros/s/AKfycbygBLfCtpqllQ-7AdnY50nlkpRvLzwfeh_hdeIftzt7WVr1QecQ7P1lj4wkyCe3EJL7gg/exec';</script>
<script>
// ===== Гури · Закупки хозов — версия на Google Таблице =====
let DATA=[],BY_ID={},CATS=[];
const SUPS=['Амега','Капцова','Костенко','Оптиком'];
const SC={'Амега':'var(--s-amega)','Капцова':'#4f7fc4','Костенко':'var(--s-kost)','Оптиком':'var(--s-opt)'};
const OPT_MIN=5000;
const CAN={saveOrder:['mgr','admin'],saveReceipt:['mgr','admin'],assign:['buy','admin'],markSent:['buy','admin'],closeAlert:['buy','admin'],addRule:['buy','admin'],offRule:['buy','admin'],baseline:['buy','dir','admin','mgr'],resetTest:['admin'],sendOrder:['buy','admin'],chatSend:['buy','admin']};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rub=n=>(Math.round(n*100)/100).toLocaleString('ru-RU',{maximumFractionDigits:2})+' ₽';
const rub0=n=>Math.round(n).toLocaleString('ru-RU')+' ₽';
const WD=['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
const WDA=['воскресенье','понедельник','вторник','среду','четверг','пятницу','субботу'];
const MSK=3*3600e3;
const nowMsk=()=>new Date(Date.now()+MSK);
const ymd=d=>d.toISOString().slice(0,10);
const fromYmd=s=>new Date(s+'T00:00:00Z');
const addDays=(d,n)=>new Date(d.getTime()+n*864e5);
const dm=s=>{const d=fromYmd(s);return String(d.getUTCDate()).padStart(2,'0')+'.'+String(d.getUTCMonth()+1).padStart(2,'0')};
const dayName=s=>WD[fromYmd(s).getUTCDay()];
const dayAcc=s=>WDA[fromYmd(s).getUTCDay()];
const hm=iso=>{if(!iso)return'';const d=new Date(new Date(iso).getTime()+MSK);if(isNaN(d))return'';return dm(ymd(d))+' '+String(d.getUTCHours()).padStart(2,'0')+':'+String(d.getUTCMinutes()).padStart(2,'0')};
function currentOrderDate(){const n=nowMsk();const t0=fromYmd(ymd(n));
  for(let i=0;i<10;i++){const d=addDays(t0,i),w=d.getUTCDay();if(w!==2&&w!==5)continue;const cut=addDays(d,-1).getTime()+9*3600e3;if(n.getTime()<cut)return ymd(d)}}
function cutText(date){const c=addDays(fromYmd(date),-1);return 'до 09:00, '+WD[c.getUTCDay()]+' '+dm(ymd(c))}
// ===== состояние
const S={role:null,view:null,tab:{mgr:'order',buy:'order'},orders:{},receipts:{},alerts:[],rules:[],prices:{},log:[],baseline:null,
  ready:false,q:'',cat:'Все',buyDate:null,recvDate:null,recv:{},busy:false};
let PASS='',WHO='';
const lsGet=k=>{try{return localStorage.getItem(k)||''}catch(e){return''}};
const lsSet=(k,v)=>{try{v?localStorage.setItem(k,v):localStorage.removeItem(k)}catch(e){}};
const can=a=>CAN[a]&&CAN[a].includes(S.role);
function status(msg,kind){const b=$('status');clearTimeout(status.t);if(!msg){b.hidden=true;return}b.hidden=false;b.className='banner '+(kind||'');b.textContent=msg;if(kind==='ok')status.t=setTimeout(()=>{b.hidden=true},7000)}
// ===== связь с таблицей
async function call(action,x){
  if(window.GURI_API){try{const r=await fetch(GURI_API,{method:'POST',body:JSON.stringify({pass:PASS,who:WHO,action,x:x||{}}),credentials:'omit',redirect:'follow'});const j=await r.json();if(j&&j.error==='server'){status('Не сохранилось: '+j.msg+'. Попробуйте ещё раз.','warn');return null}return j}catch(e){status('Нет связи с таблицей. Проверьте интернет и попробуйте ещё раз.','warn');return null}}
  return new Promise(res=>{
  if(!(window.google&&google.script&&google.script.run)){status('Нет связи с таблицей.','warn');return res(null)}
  google.script.run.withSuccessHandler(r=>res(r)).withFailureHandler(e=>{status('Не сохранилось: '+(e&&e.message||'ошибка связи')+'. Попробуйте ещё раз.','warn');res(null)}).api(PASS,WHO,action,x||{})})}
function apply(r){if(!r)return false;if(r.error==='bad_pass'){logout('Пароль больше не подходит — спросите новый у Илиды.');return false}
  if(r.error==='forbidden'){status('Это действие недоступно для вашей роли.','warn');return false}
  if(r.error==='max')status(r.msg,'warn');
  if(r.error==='locked')status('Закупщица уже отправила заказ поставщикам — изменить нельзя.','warn');
  if(r.info)status(r.info,'ok');
  if(r.state){Object.assign(S,r.state)}if(r.role)S.role=r.role;return !r.error}
async function act(action,x){S.busy=true;render();const r=await call(action,x);S.busy=false;const ok=apply(r);render();return ok}
// ===== каталог и цены
function baseP(d,s){return s==='Капцова'?d.p['Амега']:d.p[s]}
function supsFor(d){const s=Object.keys(d.p);if(s.includes('Амега'))s.splice(s.indexOf('Амега')+1,0,'Капцова');return s}
function lastP(id,s){const r=S.prices[id]&&S.prices[id][s];return r?r.price:null}
function priceFor(d,s){return lastP(d.id,s)??baseP(d,s)}
function defaultSup(d){const e=Object.entries(d.p).sort((a,b)=>a[1]-b[1]);if(d.f&&d.p['Амега']!=null)return 'Амега';return e[0][0]}
function allocate(o){const items=o&&o.items||{},ov=o&&o.assign||{};const lines=Object.keys(items).filter(id=>BY_ID[id]&&items[id]>0).map(id=>{const d=BY_ID[id];return{d,qty:items[id],sup:ov[id]||defaultSup(d),manual:!!ov[id]}});
  const optSum=lines.filter(l=>l.sup==='Оптиком').reduce((a,l)=>a+priceFor(l.d,'Оптиком')*l.qty,0);const notes=[];
  if(optSum>0&&optSum<OPT_MIN){lines.filter(l=>l.sup==='Оптиком'&&!l.manual).forEach(l=>{const alt=Object.entries(l.d.p).filter(x=>x[0]!=='Оптиком').sort((a,b)=>a[1]-b[1])[0];if(alt){l.sup=alt[0];l.moved=1}});
    if(lines.some(l=>l.moved))notes.push(`У Оптикома набиралось ${rub0(optSum)} — меньше минимума ${rub0(OPT_MIN)}, позиции переложены другим поставщикам.`)}
  return{lines,notes}}
const img=d=>d&&d.img?`<img class="thumb" src="${d.img}" alt="" loading="lazy" data-info="${d.id}" title="Подробнее">`:`<span class="thumb empty" data-info="${d?d.id:''}" title="Подробнее">нет фото</span>`;
function showInfo(id){const d=BY_ID[id];if(!d)return;let m=document.getElementById('infoDlg');if(!m){m=document.createElement('dialog');m.id='infoDlg';m.className='info';document.body.appendChild(m);m.addEventListener('click',e=>{if(e.target===m)m.close()})}
  const sups=supsFor(d);m.innerHTML=`<div class="ib">${d.img?`<img src="${d.img}" alt="">`:''}<div class="it"><small class="muted">${esc(d.c)}</small><h3>${esc(d.n)}</h3><p class="muted">Единица: ${esc(d.u)}</p>
  <table class="itbl"><tr><th>Поставщик</th><th>Как называется у них</th><th class="r">Цена</th></tr>${sups.map(s=>`<tr><td>${s}</td><td>${esc((d.sn||{})[s==='Капцова'?'Амега':s]||'—')}</td><td class="r">${rub(priceFor(d,s))}</td></tr>`).join('')}</table>
  <button class="btn primary" type="button" id="infoClose">Закрыть</button></div></div>`;m.querySelector('#infoClose').onclick=()=>m.close();m.showModal()}
document.addEventListener('click',e=>{const t=e.target.closest&&e.target.closest('[data-info]');if(t&&t.dataset.info){e.preventDefault();e.stopPropagation();showInfo(t.dataset.info)}},true);
const ROLE_N={mgr:'Управляющая Маяка',buy:'Закупщица',dir:'Руководство',admin:'Администратор'};
// ===== вход
function renderLogin(msg){$('app').hidden=true;const L=$('login');L.hidden=false;
  L.innerHTML=`<div class="panel" style="max-width:420px;margin:28px auto"><h3 style="font-size:18px">Вход</h3><p class="muted" style="margin:0 0 12px;font-size:14px">Пароль выдаёт Илида: у управляющей, закупщицы и руководства — свой.</p>
  <form id="lf" style="display:grid;gap:10px"><label>Ваше имя<input id="ln" value="${esc(WHO||lsGet('guri_who'))}" required autocomplete="name" style="width:100%;margin-top:4px;font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg)"></label>
  <label>Пароль<input id="lp" type="password" required autocomplete="current-password" style="width:100%;margin-top:4px;font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg)"></label>
  ${msg?`<div class="note">${esc(msg)}</div>`:''}<button class="btn primary" id="lb">Войти</button></form></div>`;
  $('lf').onsubmit=async e=>{e.preventDefault();PASS=$('lp').value.trim();WHO=$('ln').value.trim();$('lb').disabled=true;$('lb').textContent='Проверяю…';const r=await call('login',{});
    if(!r||r.error){PASS='';return renderLogin(r&&r.error==='bad_pass'?'Пароль не подошёл.':'Нет связи, попробуйте ещё раз.')}
    lsSet('guri_pass',PASS);lsSet('guri_who',WHO);start(r)}}
function logout(msg){PASS='';status('');S.recv={};clearInterval(start.t);lsSet('guri_pass','');S.ready=false;renderLogin(msg)}
function start(r){DATA=r.catalog||[];BY_ID=Object.fromEntries(DATA.map(d=>[d.id,d]));CATS=[...new Set(DATA.map(d=>d.c))];apply(r);
  S.view={mgr:'mgr',buy:'buy',dir:'dir',admin:'mgr'}[S.role];S.ready=true;$('login').hidden=true;$('app').hidden=false;render();
  clearInterval(start.t);start.t=setInterval(async()=>{if(document.hidden||S.busy||pendingItems)return;const x=await call('state');if(x&&!x.error){apply(x);render()}},30000)}
// ===== навигация
document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{S.view=b.dataset.role;render()});
document.querySelectorAll('[data-mt]').forEach(b=>b.onclick=()=>{S.tab.mgr=b.dataset.mt;render()});
document.querySelectorAll('[data-bt]').forEach(b=>b.onclick=()=>{S.tab.buy=b.dataset.bt;render()});
$('out').onclick=()=>logout('');
function render(){if(!S.ready)return;const v=S.view||'mgr';
  document.querySelectorAll('[data-role]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.role===v));
  ['mgr','buy','dir'].forEach(r=>$('v-'+r).hidden=r!==v);
  const cd=currentOrderDate();$('nextDel').textContent=dayName(cd)[0].toUpperCase()+dayName(cd).slice(1)+', '+dm(cd);$('nextCut').textContent='заявка '+cutText(cd);
  $('whoN').textContent=(WHO||'—')+' · '+(ROLE_N[S.role]||'');$('busy').hidden=!S.busy;
  $('bb').textContent=S.alerts.filter(a=>a.status==='open').length||'';
  if(v==='mgr'){document.querySelectorAll('[data-mt]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mt===S.tab.mgr));$('m-order').hidden=S.tab.mgr!=='order';$('m-recv').hidden=S.tab.mgr!=='recv';S.tab.mgr==='order'?renderOrder():renderRecv()}
  if(v==='buy'){document.querySelectorAll('[data-bt]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.bt===S.tab.buy));renderBuy()}
  if(v==='dir')renderDir()}
// ===== УПРАВЛЯЮЩАЯ: ЗАЯВКА
let saveTimer=null,pendingItems=null;
function usualQty(){const res={};Object.entries(S.orders).filter(([k,o])=>o.status==='sent'||o.status==='submitted').sort((a,b)=>b[0].localeCompare(a[0])).slice(0,6).forEach(([k,o])=>{Object.entries(o.items||{}).forEach(([id,q])=>{(res[id]=res[id]||[]).push(q)})});
  const u={};Object.entries(res).forEach(([id,a])=>{const s=[...a].sort((x,y)=>x-y);u[id]=s[Math.floor(s.length/2)]});return u}
function renderOrder(){const date=currentOrderDate();const o=S.orders[date]||{};const items=pendingItems||{...(o.items||{})};const ro=!can('saveOrder');const locked=o.status==='sent'||ro;const u=usualQty();
  let h=`<div class="screen-h"><div><h2>Заявка на ${dayAcc(date)}, ${dm(date)}</h2><p class="muted">Отправить закупщице ${cutText(date)}</p></div>${o.status==='sent'?'<span class="pill ok">Ушла поставщикам</span>':o.status==='submitted'?`<span class="pill ok">У закупщицы${o.submittedAt?' · '+hm(o.submittedAt):''}</span>`:'<span class="pill">Черновик</span>'}</div>`;
  if(ro)h+=`<div class="banner"><span>Вы смотрите заявку управляющей — менять её может только она.</span></div>`;
  if(o.status==='sent')h+=`<div class="banner ok"><span>Закупщица уже отправила заказ поставщикам — изменить нельзя. Если что-то срочно, напишите ей.</span></div>`;
  else if(o.status==='submitted'&&!ro)h+=`<div class="banner ok"><span>Заявка у закупщицы. Пока она не отправила её поставщикам, можно поправить — изменения сохранятся сами.</span></div>`;
  const row=d=>{const on=items[d.id]>0;const big=on&&u[d.id]&&items[d.id]>=u[d.id]*3;
    return `<label class="item ph${on?' on':''}"><input type="checkbox" data-id="${d.id}" ${on?'checked':''} ${locked?'disabled':''}>${img(d)}<span class="nm">${esc(d.n)}<small>${esc(d.u)}${u[d.id]?' · обычно '+u[d.id]:''}</small>${big?`<span class="hint">В ${Math.round(items[d.id]/u[d.id])} раза больше обычного. Точно?</span>`:''}</span>${on?`<span class="qty"><button type="button" data-m="${d.id}" ${locked?'disabled':''} aria-label="меньше">−</button><input inputmode="numeric" data-q="${d.id}" value="${items[d.id]}" ${locked?'disabled':''} aria-label="количество"><button type="button" data-pl="${d.id}" ${locked?'disabled':''} aria-label="больше">+</button></span>`:'<span></span>'}</label>`};
  const usual=DATA.filter(d=>u[d.id]);const chosen=DATA.filter(d=>items[d.id]>0&&!u[d.id]);
  if(usual.length)h+=`<section class="block"><div class="bh"><h3>Обычно берёте</h3><span class="muted">${usual.length} позиций · по прошлым заявкам</span></div><div class="list">${usual.map(row).join('')}</div></section>`;
  else if(!ro)h+=`<div class="banner"><span>Это первая заявка в системе. Найдите позиции через поиск или по разделам — со следующей недели здесь появится список «Обычно берёте».</span></div>`;
  if(chosen.length)h+=`<section class="block"><div class="bh"><h3>В заявке</h3></div><div class="list">${chosen.map(row).join('')}</div></section>`;
  if(!locked){const ql=S.q.trim().toLowerCase();
    h+=`<section class="block"><div class="bh"><h3>Каталог</h3><span class="muted">${DATA.length} позиций</span></div><input type="search" id="mq" placeholder="Поиск: губки, мешки 120, перчатки…" value="${esc(S.q)}" aria-label="Поиск по каталогу"><div class="row cats" style="margin-top:8px">${['Все',...CATS].map(c=>`<button type="button" data-c="${esc(c)}" aria-pressed="${S.cat===c}">${esc(c)}</button>`).join('')}</div>`;
    let res=DATA.filter(d=>!u[d.id]&&!(items[d.id]>0));
    const allMode=ql.length<2&&S.cat==='Все';if(ql.length>=2)res=res.filter(d=>d.n.toLowerCase().includes(ql));else if(!allMode)res=res.filter(d=>d.c===S.cat);
    h+=allMode&&res.length?CATS.map(c=>{const g=res.filter(d=>d.c===c);return g.length?`<h4 class="grp">${esc(c)} <span class="muted">· ${g.length}</span></h4><div class="list">${g.map(row).join('')}</div>`:''}).join(''):res.length?`<div class="list" style="margin-top:8px">${res.slice(0,120).map(row).join('')}</div>`:`<p class="muted" style="margin:8px 2px 0;font-size:13.5px">${ql.length>=2?'Ничего не нашлось.':'Введите 2–3 буквы или выберите раздел.'}</p>`;h+='</section>'}
  const n=Object.values(items).filter(q=>q>0).length;
  h+=`<div class="sticky"><span><b>Маяк</b>: ${n} позиций${saveTimer||S.busy?' · сохраняю…':''}</span>${o.status==='sent'||ro?'':o.status==='submitted'?'<span>Изменения сохраняются сами</span>':`<button class="btn primary" id="send" ${n&&!S.busy?'':'disabled'}>Отправить закупщице</button>`}</div>`;
  const L=$('m-order');const hadFocus=document.activeElement&&document.activeElement.id==='mq';L.innerHTML=h;
  if(hadFocus&&$('mq')){const i=$('mq');i.focus();i.setSelectionRange(i.value.length,i.value.length)}
  if($('mq'))$('mq').oninput=e=>{S.q=e.target.value;renderOrder()};
  L.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{S.cat=b.dataset.c;S.q='';renderOrder()});
  const change=(id,q)=>{const it={...items};if(q>0)it[id]=q;else delete it[id];pendingItems=it;queueSave(date);renderOrder()};
  L.querySelectorAll('input[data-id]').forEach(x=>x.onchange=()=>change(x.dataset.id,x.checked?(u[x.dataset.id]||1):0));
  L.querySelectorAll('[data-m]').forEach(b=>b.onclick=e=>{e.preventDefault();const id=b.dataset.m;change(id,Math.max(1,(items[id]||1)-1))});
  L.querySelectorAll('[data-pl]').forEach(b=>b.onclick=e=>{e.preventDefault();const id=b.dataset.pl;change(id,(items[id]||0)+1)});
  L.querySelectorAll('[data-q]').forEach(i=>{i.onclick=e=>e.preventDefault();i.onchange=()=>{const v=parseInt(i.value,10);change(i.dataset.q,v>0?v:0)}});

  const total=Math.round(lines.reduce((a,l)=>a+(Number(l.qty)||0)*(Number(l.price)||0),0)*100)/100;const nm=id=>BY_ID[id]?BY_ID[id].n:'позиция';const alerts=[];
  lines.forEach(l=>{if(!l.item||!l.price)return;const r=refPrice(l.item,s);if(r.v==null)return;const k=l.price/r.v;
    if(k>1.01&&k<=1.7)alerts.push({type:'price',item:l.item,sup:s,text:`${s} поднял цену: ${nm(l.item).slice(0,60)} — +${((k-1)*100).toFixed(0)}%`,sub:`${rub(r.v)} (${r.src}) → ${rub(l.price)} в накладной от ${dm(date)}. Переплата на этой поставке: ${rub((l.price-r.v)*(Number(l.qty)||0))}.`,over:Math.round((l.price-r.v)*(Number(l.qty)||0)*100)/100})});
  ordered.forEach(o=>{const got=lines.filter(l=>l.item===o.d.id).reduce((a,l)=>a+(Number(l.qty)||0),0);if(got<o.qty)alerts.push({type:'short',item:o.d.id,sup:s,text:`${s}: недовоз — ${o.d.n.slice(0,60)}`,sub:`Заказали ${o.qty} ${o.d.u}, пришло ${got}. Поставка ${dm(date)}.`})});
  lines.filter(l=>!l.item||!ordered.some(o=>o.d.id===l.item)).forEach(l=>alerts.push({type:'extra',item:l.item,sup:s,text:`${s}: в накладной то, чего не заказывали — ${(l.name||nm(l.item)).slice(0,60)}`,sub:`${l.qty} × ${rub(l.price||0)}. Поставка ${dm(date)}. Если не нужно — вычеркнуть из накладной и вернуть.`}));
  if(D.total&&Math.abs(D.total-total)>1)alerts.push({type:'other',sup:s,text:`${s}: сумма накладной не сходится со строками`,sub:`В накладной ${rub(D.total)}, по строкам ${rub(total)}. Поставка ${dm(date)}.`});
  const ok=await act('saveReceipt',{date,sup:s,lines,total:D.total||total,linesTotal:total,doc:D.doc||'',photos:D.files,alerts});
  if(ok){delete S.recv[date][s];status(alerts.length?`Сохранено. Закупщица получила ${alerts.length} вопрос(а) — писать ей отдельно не нужно.`:'Сохранено. Расхождений нет.','ok');render()}}
// ===== РУКОВОДСТВО
function renderDir(){const M=$('d-main');const m=ymd(nowMsk()).slice(0,7);
  const recs=Object.entries(S.receipts).filter(([d])=>d.startsWith(m));const spend=recs.reduce((a,[d,r])=>a+Object.values(r.sups||{}).reduce((x,s)=>x+(Number(s.total)||0),0),0);
  const ords=Object.entries(S.orders).filter(([d,o])=>d.startsWith(m)&&o.status==='sent').length;
  const am=S.alerts.filter(a=>(a.date||'').startsWith(m));const pu=am.filter(a=>a.type==='price');const over=pu.reduce((a,x)=>a+(Number(x.over)||0),0);
  const disc=am.filter(a=>a.type!=='price').length;const open=S.alerts.filter(a=>a.status==='open').length;const b=S.baseline||{};const ed=can('baseline');
  const MON=['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
  let h=`<p class="lead" style="margin-top:16px">Маяк, хозы, ${MON[+m.slice(5)-1]} ${m.slice(0,4)}. Всё ниже — из заявок и приёмок в системе. Подробные строки — в Google Таблице, вкладки «Заявки» и «Журнал».</p>
  <div class="kpis"><div class="kpi"><div class="l">Заказов отправлено поставщикам</div><div class="v">${ords}</div></div>
  <div class="kpi"><div class="l">По накладным за месяц</div><div class="v">${rub0(spend)}</div><div class="l">${recs.length} поставок принято</div></div>
  <div class="kpi"><div class="l">Подорожаний поймано</div><div class="v">${pu.length}</div><div class="l">${over?'переплата на поставках '+rub0(over):'—'}</div></div>
  <div class="kpi"><div class="l">Расхождений на приёмке</div><div class="v">${disc}</div><div class="l">открытых вопросов: ${open}</div></div></div>`;
  if(pu.length)h+=`<h2>Подорожания</h2><div class="panel tbl"><table><tr><th>Когда</th><th>Что</th><th>Статус</th></tr>${pu.sort((a,c)=>(c.at||'').localeCompare(a.at||'')).map(a=>`<tr><td>${dm(a.date)}</td><td>${esc(a.text)}<small class="muted" style="display:block">${esc(a.sub||'')}</small></td><td>${a.status==='open'?'<span class="st warn">открыт</span>':'<span class="st ok">'+esc(a.note||'закрыт')+'</span>'}</td></tr>`).join('')}</table></div>`;
  h+=`<h2>Замер «до» старта</h2><div class="panel"><p class="muted" style="margin:0 0 10px;font-size:13.5px">Заполняем один раз до 16 ноября. Через месяц сравним с тем, что покажет система.</p>
   <div class="rules">${[['buyMin','Минут у закупщицы на один цикл: собрать заявки и разослать поставщикам'],['mgrMin','Минут у управляющей на одну заявку'],['recvMin','Минут у управляющей на одну приёмку'],['spendSep','Расходы Маяка на хозы за сентябрь, ₽'],['spendOct','Расходы Маяка на хозы за октябрь, ₽']].map(([k,l])=>`<label class="rule"><b>${l}</b><input data-bl="${k}" inputmode="decimal" value="${b[k]??''}" ${ed?'':'disabled'} class="inp" style="width:100%;margin-top:6px"></label>`).join('')}</div>${b.at?`<p class="muted" style="font-size:12.5px;margin:8px 0 0">Обновлено ${hm(b.at)}${b.by?' · '+esc(b.by):''}</p>`:''}</div>`;
  h+=`<h2>Договорённости с поставщиками</h2><div class="panel">${rulesList(false)}</div>`;
  h+=`<h2>Журнал</h2><div class="panel"><ul class="log">${S.log.length?S.log.slice(0,60).map(l=>`<li><time>${hm(l.t)}</time>${esc(l.x)}${l.u?` <span class="muted">· ${esc(l.u)}</span>`:''}</li>`).join(''):'<li class="muted">Здесь появятся действия управляющей и закупщицы.</li>'}</ul></div>`;
  if(S.role==='admin')h+=`<div class="panel"><h3>Только для Илиды</h3><p class="muted" style="margin:0 0 8px">Перед стартом теста удалить тестовые заявки, приёмки, переписку и журнал. Каталог, пароли и подключения к боту останутся.</p><button class="btn" id="rst">Очистить тестовые данные</button></div>`;
  M.innerHTML=h;const rb=$('rst');if(rb)rb.onclick=()=>{if(rb.dataset.c){act('resetTest',{})}else{rb.dataset.c=1;rb.textContent='Точно очистить? Нажмите ещё раз'}};
  M.querySelectorAll('[data-bl]').forEach(i=>i.onchange=()=>{const v=parseFloat(String(i.value).replace(',','.').replace(/\s/g,''));act('baseline',{k:i.dataset.bl,v:isNaN(v)?null:v})})}
// ===== запуск
(async()=>{PASS=lsGet('guri_pass');WHO=lsGet('guri_who');if(!PASS)return renderLogin('');
  $('login').hidden=false;$('login').innerHTML='<div class="panel" style="max-width:420px;margin:28px auto"><p class="muted">Загружаю…</p></div>';
  const r=await call('login',{});if(!r||r.error)return renderLogin(r&&r.error==='bad_pass'?'Пароль сменился — войдите заново.':'Нет связи, попробуйте ещё раз.');start(r)})();

</script>
